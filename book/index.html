      <div class="field">

const USER_COLORS={
  "김호영":{bg:"#F5D9D4",fg:"#A8392B"},"박성철":{bg:"#F7E0CC",fg:"#B0642A"},
  "안정민":{bg:"#F4E8C6",fg:"#94741C"},"조성훈":{bg:"#E7ECCB",fg:"#6C782C"},

  "이준영":{bg:"#DBDFE3",fg:"#485663"}
};
function colorFor(name){
  if(USER_COLORS[name]) return USER_COLORS[name];
  let h=0; for(const ch of (name||"?")) h=(h*31+ch.charCodeAt(0))%360;
  return {bg:`hsl(${h},32%,87%)`,fg:`hsl(${h},42%,33%)`};
}

async function authedFetch(url,opts){
  const r=await fetch(url,opts);
  if(r.status===401){ location.href="/"; throw new Error("unauthenticated"); }
  return r;
}
let YEARS=[...new Set(data.map(d=>d.year))].sort((a,b)=>b-a);

const normTitle=t=>(t||"").replace(/\s+/g,"").toLowerCase();
const fmt=n=>n==null?"—":n.toLocaleString("ko-KR");
const esc=s=>(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function shortDate(ds){if(!ds)return "—";const p=ds.split("-");return `${parseInt(p[1])}월${parseInt(p[2])}일`;}
function displayPrice(d){return d.price==null?null:(d.gubun==="직무관련"?Math.round(d.price/2):d.price);}
function formatPriceInput(el){const digits=el.value.replace(/[^\d]/g,"");el.value=digits?Number(digits).toLocaleString("ko-KR"):"";}
function parsePriceInput(v){const digits=(v||"").replace(/[^\d]/g,"");return digits?parseInt(digits):null;}

function buildApplicantFilter(){
  document.getElementById("applicantFilter").innerHTML=APPLICANTS.map(n=>{
    const c=colorFor(n), on=n===filterApplicant;
    const cnt=data.filter(d=>d.applicant===n&&(activeYear==="all"||d.year===activeYear)).length;
    const style=on?`background:${c.fg};color:#fff;border-color:${c.fg}`:`background:${c.bg};color:${c.fg};border-color:transparent`;
    return `<span class="pchip" style="${style}" onclick="filterByApplicant('${n}')">${n} (${cnt})</span>`;
  }).join("");
}
function filterByApplicant(n){filterApplicant=(filterApplicant===n)?"":n;render();}

function buildYearSelect(){
  const sel=document.getElementById("yearSel");
  sel.innerHTML=`<option value="all">전체 연도</option>`+YEARS.map(y=>`<option value="${y}">${y}년</option>`).join("");
  sel.value=String(activeYear);
}
function onYear(v){activeYear=(v==="all")?"all":parseInt(v);editingId=null;render();}

function render(){
  buildApplicantFilter();
  const raw=document.getElementById("q").value.trim();
  const q=normTitle(raw);
  let rows=data.slice();
  if(q){
    rows=rows.filter(d=>normTitle(d.title).includes(q));
    document.getElementById("ledgerTitle").textContent=`"${raw}" 검색 결과`;
  }else{
    if(activeYear!=="all") rows=rows.filter(d=>d.year===activeYear);
    document.getElementById("ledgerTitle").textContent=activeYear==="all"?"전체 신청 목록":activeYear+"년 신청 목록";
  }
  if(filterApplicant) rows=rows.filter(d=>d.applicant===filterApplicant);
  rows.sort((a,b)=>(b.date||"").localeCompare(a.date||"")||b.id-a.id);
  document.getElementById("ledgerCount").textContent=`${rows.length}건`;

  const totalEl=document.getElementById("applicantTotal");
  if(filterApplicant){
    const sum=rows.reduce((s,d)=>s+(displayPrice(d)||0),0);
    document.getElementById("applicantTotalLabel").textContent=`${filterApplicant}님 합계`;
    document.getElementById("applicantTotalSum").textContent=`${fmt(sum)}원`;
    totalEl.style.display="flex";
  }else{
    totalEl.style.display="none";
  }

  const list=document.getElementById("list");
  if(!rows.length){
    list.innerHTML=`<div class="empty"><div class="big">신청 내역이 없어요</div><div>상단의 <b>신청</b> 버튼으로 도서를 신청해 보세요.</div></div>`;
    return;
  }
  list.innerHTML=rows.map(d=> d.id===editingId ? editRow(d) : viewRow(d)).join("");
}

  return `<li class="row">

        <div class="r-text">
          <div class="r-top">

    </div>
    <div class="r-rail">
      <div class="r-price">${fmt(displayPrice(d))}<span class="won">원</span></div>
      ${rel?`<div class="price-sub">단가 50% 지원</div>`:""}
      <div class="r-status">${status}</div>
      <div class="r-actions">${actions}</div>
    </div>
  </li>`;
}

function editRow(d){
  const c=colorFor(d.applicant);
  return `<li class="row">
    <div class="r-main">
      <div class="r-top">
        <span class="ubadge" style="background:${c.bg};color:${c.fg}">${esc(d.applicant)||"미지정"}</span>
        <span class="r-date">${shortDate(d.date)}</span>
      </div>
      <input id="ed-title" class="ef title" value="${esc(d.title)}" placeholder="도서명" oninput="onEditTitleInput()" autocomplete="off">
      <div class="booksearch" id="ed-booksearch"></div>
      <div class="egrid">
        <input id="ed-author" class="ef" value="${esc(d.author)}" placeholder="저자">
        <input id="ed-pub" class="ef" value="${esc(d.publisher)}" placeholder="출판사">
      </div>
      <div class="egrid">
        <select id="ed-gubun" class="ef">
          <option value="직무관련" ${d.gubun==="직무관련"?"selected":""}>직무관련</option>
          <option value="직무무관" ${d.gubun==="직무무관"?"selected":""}>직무무관</option>
        </select>
        <input id="ed-price" class="ef" type="text" inputmode="numeric" value="${d.price==null?"":d.price.toLocaleString("ko-KR")}" placeholder="단가" oninput="formatPriceInput(this)">
      </div>
      <input id="ed-note" class="ef ef-note" value="${esc(d.note)}" placeholder="비고">
      <input id="ed-kyobo" class="ef ef-note" value="${esc(d.kyobo_url)}" placeholder="교보문고 링크(비우면 자동 검색)">
    </div>
    <div class="r-rail">
      <div class="r-actions">
        <button class="act save" onclick="saveEdit(${d.id})">저장</button>
        <button class="act" onclick="cancelEdit()">취소</button>
      </div>
    </div>
  </li>`;
}

async function toggle(id){const d=data.find(x=>x.id===id);if(!d)return;const nv=!d.done;d.done=nv;render();
  if(serverMode){try{const r=await authedFetch(`${API}/${id}`,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify({done:nv})});if(!r.ok)throw 0;}catch(e){d.done=!nv;render();showToast("저장 실패 — 서버 연결 확인");return;}}
  showToast(nv?`"${d.title}" 처리완료`:`"${d.title}" 미처리로 취소`);}

function startEdit(id){
  editingId=id;
  const d=data.find(x=>x.id===id);
  editPickedThumbnail=d?(d.thumbnail||""):"";
  render();
}
function cancelEdit(){editingId=null;render();}
async function saveEdit(id){
  const d=data.find(x=>x.id===id);if(!d)return;
  const t=document.getElementById("ed-title").value.trim();
  if(!t){showToast("도서명을 입력해 주세요");return;}
  const patch={title:t,
    author:document.getElementById("ed-author").value.trim(),
    publisher:document.getElementById("ed-pub").value.trim(),
    gubun:document.getElementById("ed-gubun").value,
    price:parsePriceInput(document.getElementById("ed-price").value),
    note:document.getElementById("ed-note").value.trim(),
    thumbnail:editPickedThumbnail||null};
  const y=document.getElementById("ed-kyobo").value.trim();
  if(y!==(d.kyobo_url||"")) patch.kyobo_url=y;
  Object.assign(d,patch);editingId=null;render();
  if(serverMode){
    try{
      const r=await authedFetch(`${API}/${id}`,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(patch)});
      if(!r.ok)throw 0;
      const saved=await r.json();
      Object.assign(d,saved);render();
    }catch(e){showToast("저장 실패 — 서버 연결 확인");return;}
  }
  showToast("수정 완료");
}

function askDelete(id){
  const d=data.find(x=>x.id===id);if(!d)return;
  pendingDelete=id;
  document.getElementById("confirmText").textContent=`"${d.title}" 신청을 삭제할까요? 되돌릴 수 없어요.`;
  document.getElementById("confirmOverlay").classList.add("open");
}
function closeConfirm(){pendingDelete=null;document.getElementById("confirmOverlay").classList.remove("open");}
async function doDelete(){
  const id=pendingDelete;closeConfirm();
  if(id==null)return;
  const d=data.find(x=>x.id===id);
  data=data.filter(x=>x.id!==id);
  if(editingId===id)editingId=null;
  render();showToast(d?`"${d.title}" 삭제됨`:"삭제됨");
  if(serverMode){try{const r=await authedFetch(`${API}/${id}`,{method:"DELETE"});if(!r.ok)throw 0;}catch(e){showToast("삭제 실패 — 서버 연결 확인");}}
}

function openForm(){
  document.getElementById("overlay").classList.add("open");
  const t=new Date();
  document.getElementById("f-date").value=`${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,"0")}-${String(t.getDate()).padStart(2,"0")}`;
}
function closeForm(){
  document.getElementById("overlay").classList.remove("open");
  ["f-title","f-author","f-pub","f-price","f-note"].forEach(i=>document.getElementById(i).value="");
  document.getElementById("dup").classList.remove("show");
  document.getElementById("price-notice").classList.remove("show");
  document.getElementById("booksearch").classList.remove("show");
  document.getElementById("booksearch").innerHTML="";
  pickedThumbnail="";
  gubun="직무무관";
  [...document.querySelectorAll("#seg button")].forEach(b=>b.classList.toggle("on",b.dataset.v==="직무무관"));
  buildPicker();
}
function setGubun(btn){
  gubun=btn.dataset.v;
  [...document.querySelectorAll("#seg button")].forEach(b=>b.classList.remove("on"));
  btn.classList.add("on");
  document.getElementById("price-notice").classList.toggle("show",gubun==="직무관련");
}

function buildPicker(){
  // 신청자는 항상 로그인한 본인 — 다른 사람으로 바꿀 수 없다(서버도 동일하게 강제).
  pickApplicant=me.name;
  const c=me.color||colorFor(me.name).fg;
  document.getElementById("picker").innerHTML=
    `<span class="pchip" style="background:${c};color:#fff;border-color:${c};cursor:default">${esc(me.name)||"본인 정보 확인 중"}</span>`;
}

function checkDup(){
  const t=normTitle(document.getElementById("f-title").value);
  const box=document.getElementById("dup"),ul=document.getElementById("dup-list");
  if(t.length<2){box.classList.remove("show");return;}
  const hits=data.filter(d=>normTitle(d.title)===t).sort((a,b)=>(b.date||"").localeCompare(a.date||""));
  if(!hits.length){box.classList.remove("show");return;}
  ul.innerHTML=hits.map(h=>`<li><b>${esc(h.title)}</b> <span class="who">— ${h.year}년 ${shortDate(h.date)} · ${esc(h.applicant)}님 신청 · ${h.done?"처리완료":"미처리"}</span></li>`).join("");
  box.classList.add("show");
}

function onTitleInput(){
  checkDup();
  pickedThumbnail="";
  clearTimeout(searchT);
  const q=document.getElementById("f-title").value.trim();
  const box=document.getElementById("booksearch");
  if(!serverMode || q.length<2){box.classList.remove("show");box.innerHTML="";return;}
  searchT=setTimeout(()=>searchBooks(q),400);
}

async function searchBooks(q){
  const box=document.getElementById("booksearch");
  try{
    const r=await authedFetch(`/api/booksearch?q=${encodeURIComponent(q)}`);
    if(!r.ok)throw 0;
    lastBookResults=await r.json();
    if(!lastBookResults.length){box.classList.remove("show");box.innerHTML="";return;}
    box.innerHTML=lastBookResults.map((b,i)=>`<div class="bs-item" onclick="pickBook(${i})">
      <div class="bs-thumb">${b.thumbnail?`<img src="${esc(b.thumbnail)}" alt="">`:""}</div>
      <div class="bs-text">
        <div class="bs-title">${esc(b.title)}</div>
        <div class="bs-sub">${esc(b.author)||"저자 미상"} · ${esc(b.publisher)||"출판사 미상"}${b.price?` · ${fmt(b.price)}원`:""}</div>
      </div>
    </div>`).join("");
    box.classList.add("show");
  }catch(e){box.classList.remove("show");box.innerHTML="";}
}

function pickBook(i){
  const b=lastBookResults[i];
  if(!b)return;
  document.getElementById("f-title").value=b.title;
  document.getElementById("f-author").value=b.author||"";
  document.getElementById("f-pub").value=b.publisher||"";
  if(b.price) document.getElementById("f-price").value=b.price.toLocaleString("ko-KR");
  pickedThumbnail=b.thumbnail||"";
  document.getElementById("booksearch").classList.remove("show");
  checkDup();
}

function onEditTitleInput(){
  editPickedThumbnail="";
  clearTimeout(editSearchT);
  const q=document.getElementById("ed-title").value.trim();
  const box=document.getElementById("ed-booksearch");
  if(!serverMode || q.length<2){box.classList.remove("show");box.innerHTML="";return;}
  editSearchT=setTimeout(()=>searchEditBooks(q),400);
}

async function searchEditBooks(q){
  const box=document.getElementById("ed-booksearch");
  try{
    const r=await authedFetch(`/api/booksearch?q=${encodeURIComponent(q)}`);
    if(!r.ok)throw 0;
    lastEditBookResults=await r.json();
    if(!lastEditBookResults.length){box.classList.remove("show");box.innerHTML="";return;}
    box.innerHTML=lastEditBookResults.map((b,i)=>`<div class="bs-item" onclick="pickEditBook(${i})">
      <div class="bs-thumb">${b.thumbnail?`<img src="${esc(b.thumbnail)}" alt="">`:""}</div>
      <div class="bs-text">
        <div class="bs-title">${esc(b.title)}</div>
        <div class="bs-sub">${esc(b.author)||"저자 미상"} · ${esc(b.publisher)||"출판사 미상"}${b.price?` · ${fmt(b.price)}원`:""}</div>
      </div>
    </div>`).join("");
    box.classList.add("show");
  }catch(e){box.classList.remove("show");box.innerHTML="";}
}

function pickEditBook(i){
  const b=lastEditBookResults[i];
  if(!b)return;
  document.getElementById("ed-title").value=b.title;
  document.getElementById("ed-author").value=b.author||"";
  document.getElementById("ed-pub").value=b.publisher||"";
  if(b.price) document.getElementById("ed-price").value=b.price.toLocaleString("ko-KR");
  editPickedThumbnail=b.thumbnail||"";
  document.getElementById("ed-booksearch").classList.remove("show");
}

async function submitForm(){
  const title=document.getElementById("f-title").value.trim();
  if(!pickApplicant){showToast("신청자를 선택해 주세요");return;}
  if(!title){showToast("도서명을 입력해 주세요");return;}
  const dv=document.getElementById("f-date").value||new Date().toISOString().slice(0,10);
  const payload={applicant:pickApplicant,date:dv,gubun,title,
    author:document.getElementById("f-author").value.trim(),
    publisher:document.getElementById("f-pub").value.trim(),
    price:parsePriceInput(document.getElementById("f-price").value),
    note:document.getElementById("f-note").value.trim(),
    thumbnail:pickedThumbnail||null};
  let rec;
  if(serverMode){
    try{const r=await authedFetch(API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});
      if(!r.ok)throw 0; rec=await r.json();}
    catch(e){showToast("등록 실패 — 서버 연결 확인");return;}
  }else{
    rec={...payload,id:Math.max(0,...data.map(d=>d.id))+1,year:parseInt(dv.slice(0,4)),done:false};
  }
  data.push(rec);
  if(!YEARS.includes(rec.year)){YEARS.push(rec.year);YEARS.sort((a,b)=>b-a);}
  closeForm();
  document.getElementById("q").value="";
  activeYear=rec.year; editingId=null;
  buildYearSelect();render();
  showToast(`"${title}" 신청 등록 완료`);
}

let toastT;
function showToast(m){const el=document.getElementById("toast");el.textContent=m;el.classList.add("show");clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove("show"),2200);}

async function loadWhoami(){
  try{
    const r=await fetch("/api/whoami");
    const who=await r.json();
    me={name:who.name||"",email:who.email||"",color:who.color||""};
    const portalUrl=(who.portal_url||"").replace(/\/+$/,"");
    document.getElementById("hdrBrand").href=portalUrl||"#";
    document.getElementById("dd-mypage").href=portalUrl?`${portalUrl}/?view=profile`:"#";
    document.getElementById("dd-slack").href=who.slack_url||"#";
    document.getElementById("dd-logout").href=portalUrl?`${portalUrl}/api/logout.php`:"#";
    document.getElementById("hdrName").textContent=me.name;
    const av=document.getElementById("hdrAvatar");
    av.textContent=me.name.slice(0,1);
    av.style.background=me.color||colorFor(me.name).fg;
  }catch(e){ me={name:"",email:"",color:""}; }
}

function toggleUserMenu(e){
  if(e) e.stopPropagation();
  document.getElementById("hdrUserMenu").classList.toggle("open");
}
document.addEventListener("click",(e)=>{
  const um=document.getElementById("hdrUserMenu");
  if(um && !um.contains(e.target)) um.classList.remove("open");
});

async function loadData(){
  try{
    const r=await authedFetch(API);
    if(!r.ok)throw 0;
    data=await r.json();serverMode=true;
  }catch(e){
    if(e && e.message==="unauthenticated") return; // 이미 포털로 이동 중
    data=SEED.slice();serverMode=false;
    showToast("데모 모드 — 서버 없이 실행 중 (변경사항 저장 안 됨)");
  }
  YEARS=[...new Set(data.map(d=>d.year))].sort((a,b)=>b-a);
  buildYearSelect();render();
}

(async function(){
  await loadWhoami();
  buildPicker();
  buildApplicantFilter();
  document.addEventListener("keydown",e=>{if(e.key==="Escape"){closeForm();closeConfirm();}});
  loadData();
})();
</script>
</body>
</html>
