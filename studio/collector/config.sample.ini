[db]
host = 127.0.0.1
port = 3306
name = iworks_local
user = root
password = 
charset = utf8mb4

[source]
boards = 블루소프트
include_archived = true
; !! T0000000/F0000000 은 가짜 값입니다. 반드시 바꾸십시오.
;    포털 config.php 의 list_url 과 같은 값이며, 수집기는 이 값으로
;    bs_work_item.source_url 을 만들어 저장합니다. 가짜인 채로 수집하면
;    열리지 않는 링크가 DB 에 쌓이고, 나중에 고쳐도 되돌아오지 않습니다
;    (다시 수집해야 합니다). 그대로 두면 실행할 때마다 경고가 뜹니다.
list_url = https://bluesoft.slack.com/lists/T0000000/F0000000
skip_empty_title = true

[collect]
default_days = 7
batch_size = 500
dry_run_limit = 100

[normalize]
orgs_file = orgs.json
aliases_file = member_aliases.json
use_schools_table = true

[log]
level = info
unmatched_file = unmatched_members.log

[score]
baseline_percentile = 0.90

