- id: LMS-001
  question: COURSEMOS가 무엇인가요?
  aliases:
    - 코스모스
    - 자체 LMS 있나요
  answer: 오픈소스 LMS인 Moodle을 국내 정서에 맞게 패키징한 학습관리 플랫폼입니다. 이러닝 평생교육기업 유비온과 공동으로 개발·배포하고 있습니다.

- id: LMS-002
  question: COURSEMOS의 주요 기능은 무엇인가요?
  aliases:
    - 기능 목록
    - 뭐가 되나요
  answer: 대시보드·일정관리·테마·알림 등 개인화 서비스, 학사행정시스템·SSO·기간계 연동, 주차/토픽 단위 강좌 구성과 평가 도구, 대용량 파일 업로드, 팀 프로젝트 협력학습, 학습·운영 통계, 문서·동영상 뷰어, 모바일웹과 전용앱을 제공합니다.

- id: LMS-003
  question: 최신 버전은 무엇인가요?
  aliases:
    - 버전
    - 최신
  answer: 2026년 출시된 COURSEMOS LXP 4.5 패키지가 최신입니다.

- id: LMS-004
  question: 무들(Moodle) 구축도 해주나요?
  aliases:
    - Moodle 설치
    - 무들 구축
  answer: 고객 환경과 요구사항에 맞춘 Moodle 구축을 지원합니다. 운영 방안 컨설팅, 웹서버·DB·스트리밍 환경 구축, 백업 및 이중화 구성까지 포함합니다.

- id: LMS-005
  question: 무들 버전 업그레이드나 데이터 이관도 가능한가요?
  aliases:
    - 버전 올리기
    - 서버 이전
  answer: 가능합니다. 무들 상위 버전 업그레이드와 데이터 이관을 수행합니다. 현재 사용 중인 버전과 커스터마이징 범위를 확인한 뒤 일정과 비용을 산정합니다.

- id: LMS-006
  question: 무들 화면을 우리 학교 스타일로 바꿀 수 있나요?
  aliases:
    - 테마
    - 디자인 변경
    - 커스터마이징
  answer: 가능합니다. 고객사 중심의 맞춤형 테마 개발과 기존 테마 커스터마이징을 지원하며, 기본 주차/토픽 외의 신규 강의포맷과 별도 학습모듈·블록 개발도 가능합니다.

- id: LMS-007
  question: LMS 구축 비용은 얼마인가요?
  aliases:
    - LMS 가격
    - 얼마나 드나요
    - 견적
  answer: LMS는 공개된 기준가가 없습니다. 기관 유형, 수강 인원과 동시접속 규모, 커스터마이징 범위에 따라 달라지므로 담당자가 확인 후 산정해 드립니다.

- id: LMS-008
  question: 어떤 곳에 구축할 수 있나요?
  aliases:
    - 우리 기관도 되나요
  answer: 국내외 대학, 학교, 연구소, 기업, 학원 등 다양한 분야에 구축 가능합니다.

- id: LMS-009
  question: COURSEMOS 도입 문의는 어디로 하나요?
  aliases:
    - 어디로 연락하나요
    - 유비온에 물어야 하나요
  answer: 블루소프트로 문의 주시면 담당자가 안내해 드립니다. COURSEMOS는 유비온과 공동으로 개발·배포하고 있으며, 필요한 경우 담당자가 함께 확인해 드립니다.
