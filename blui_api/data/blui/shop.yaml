- id: SHOP-001
  question: 쇼핑몰 제작 비용이 얼마인가요?
  aliases:
    - 쇼핑몰 가격
    - 쇼핑몰 얼마
    - 쇼핑몰 견적
    - 쇼핑몰 비용
    - 온라인몰 얼마
    - 쇼핑몰 만드는데
    - 쇼핑몰 제작비
  answer: 일반형 쇼핑몰은 200만원부터 시작합니다(VAT 별도, 요구사항에 따라 변동). 해외몰이나 도매몰 같은 주문제작형은 작업 범위에 따라 별도로 협의합니다.

- id: SHOP-002
  question: 일반형 쇼핑몰에는 무엇이 포함되나요?
  aliases:
    - 쇼핑몰 포함 범위
    - 쇼핑몰 기본
    - 일반형 쇼핑몰
    - 쇼핑몰 기본 기능
    - 카테고리
    - 쇼핑몰 제작 기간
    - 쇼핑몰 모바일
    - 카페24
    - 카페24 쇼핑몰
  answer: 일반형 쇼핑몰은 카페24를 기반으로 제작하는 상품입니다. 5페이지 이내로 구성되며 카테고리 무제한, 초기 상품 5개 등록 대행, 모바일 화면, PG사 등록비 지원이 포함됩니다. 제작 기간은 영업일 기준 2주 이상이고, 수정은 2회까지 가능합니다.

- id: SHOP-003
  question: 일반 쇼핑몰이 아닌 형태도 되나요?
  aliases:
    - B2B
    - 도매몰
    - 해외몰
    - 견적형
    - 캐시충전
    - 상세페이지
    - 기업 간 거래
    - 글로벌 쇼핑몰
    - 특수 쇼핑몰
    - 수출용
  answer: 가능합니다. 견적형 쇼핑몰, 캐시충전형, 해외 쇼핑몰, 도매 쇼핑몰, 제품 상세페이지 제작까지 진행할 수 있습니다.

- id: SHOP-004
  question: 결제 연동도 해주나요?
  aliases:
    - 카드결제
    - PG
    - 결제 붙이기
    - 결제 시스템
    - 계좌이체
    - 간편결제
    - 결제 모듈
    - 네이버페이
    - 결제 연동
  answer: PG 전자결제 연동이 가능하며, 일반형 상품에는 PG사 등록비가 지원됩니다. 결제 수수료 등 PG사 자체 조건은 별도입니다.

- id: SHOP-005
  question: 상품 등록은 직접 해야 하나요?
  aliases:
    - 상품 등록
    - 상품 올리기
    - 상품 입력
    - 상품 등록 대행
    - 제품 등록
    - 상품 몇 개
    - 상품 100개
  answer: 일반형 기준으로 초기 상품 5개는 등록을 대행해 드립니다. 이후에는 관리자 화면에서 직접 등록하시거나, 별도로 협의해 진행합니다.
