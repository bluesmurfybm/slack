- id: SHOP-001
  question: 쇼핑몰 제작 비용이 얼마인가요?
  aliases:
    - 쇼핑몰 가격
  answer: 일반형 쇼핑몰은 200만원부터(VAT 별도, 요구사항에 따라 변동)입니다. 해외몰·도매몰 등 주문제작형은 작업 범위에 따라 협의합니다.

- id: SHOP-002
  question: 일반형 쇼핑몰에는 무엇이 포함되나요?
  answer: 5페이지 이내로 구성되며 쇼핑몰 카테고리 무제한, 상품 초기 5개 등록 대행, 모바일 화면, PG사 등록비 지원이 포함됩니다. 제작 기간은 영업일 기준 2주부터, 수정 2회입니다.

- id: SHOP-003
  question: 일반 쇼핑몰이 아닌 형태도 되나요?
  aliases:
    - B2B
    - 도매몰
    - 해외몰
  answer: 됩니다. 견적형 쇼핑몰, 캐시충전형, 해외 쇼핑몰, 도매 쇼핑몰, 제품 상세페이지 제작까지 가능합니다.

- id: SHOP-004
  question: 결제 연동도 해주나요?
  answer: PG 전자결제 연동이 가능하며 일반형 상품에는 PG사 등록비가 지원됩니다. 결제 수수료 등 PG사 자체 조건은 별도입니다.

- id: SHOP-005
  question: 상품 등록은 직접 해야 하나요?
  answer: 일반형 기준으로 초기 상품 5개 등록을 대행해 드립니다. 이후 등록은 관리자 화면에서 직접 하시거나 별도 협의로 진행합니다.
