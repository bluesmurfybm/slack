- id: MKT-001
  question: 블리다가 무엇인가요?
  aliases:
    - BLUEEDA
    - 마케팅 서비스
  answer: 2018년 출시한 블루소프트의 디지털마케팅 에이전시 서비스입니다. 광고·홍보부터 판매까지 온라인 마케팅 전반을 지원합니다.

- id: MKT-002
  question: 어떤 채널을 다루나요?
  aliases:
    - 블로그
    - 스마트스토어
    - 검색광고
  answer: 네이버 블로그, 스마트스토어, 검색등록, 검색광고와 Wix·imWeb·Canva 같은 제작 도구를 활용합니다.

- id: MKT-003
  question: 구체적으로 무엇을 도와주나요?
  answer: E-Marketing 환경 구축, 광고·홍보 지원, 판매·영업 환경 구축, 교육·컨설팅을 제공합니다. 직접 운영하고 싶은 경우 도구 사용 교육도 가능합니다.

- id: MKT-004
  question: 마케팅 비용은 얼마인가요?
  aliases:
    - 광고비
    - 월 얼마
  answer: 공개된 기준가가 없습니다. 목표 채널과 월 예산에 따라 달라지므로 담당자가 확인 후 제안해 드립니다.
