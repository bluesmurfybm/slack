- id: SHE-001
  question: SHEblue가 무엇인가요?
  aliases:
    - SHE 시스템
    - 안전보건 시스템
  answer: 안전(Safety)·보건(Health)·환경(Environment) 업무를 기업 내 기반 시스템과 연계해 통합관리하는 웹 기반 전산시스템입니다. 별도 설치 없이 브라우저에서 사용하며, 업무 단위로 모듈화되어 기업별 요구에 맞게 재구성할 수 있습니다.

- id: SHE-002
  question: 안전 분야에서 어떤 기능을 제공하나요?
  aliases:
    - 위험성평가
    - 근골격계
  answer: 환경안전사전검토, 위험성평가, 근골격계질환예방관리, 안전작업허가관리, 안전점검, 유해위험기구·안전보호구 관리, 교육 및 훈련관리, 재해 및 사고 관리 등을 제공합니다.

- id: SHE-003
  question: 보건 분야 기능은 무엇인가요?
  aliases:
    - 건강검진
    - MSDS
  answer: 건강관리실 방문관리, 유소견자관리, 건강검진관리와 검진 통계·추이, MSDS(물질안전보건자료), 작업환경 측정관리를 제공합니다. 엑셀로 건강검진·작업환경측정 대용량 데이터를 업로드할 수 있습니다.

- id: SHE-004
  question: 환경 분야 기능은 무엇인가요?
  aliases:
    - 폐기물
    - 배출시설
  answer: 용수사용량일보관리, 배출시설 및 방지시설관리, 환경영향평가, 폐기물관리, 유독물 관리대장, 전기·용수·도시가스 사용량 관리를 제공합니다.

- id: SHE-005
  question: 기존 시스템과 연동이 되나요?
  aliases:
    - ERP 연동
    - 그룹웨어
  answer: ERP, 그룹웨어 등 타 시스템과 연계할 수 있습니다. 사용자 그룹별·부서별 권한 부여도 가능합니다.

- id: SHE-006
  question: 인증 대응에도 쓸 수 있나요?
  aliases:
    - ISO 14001
    - KOSHA
  answer: ISO 14001, OHSAS 18001, KOSHA 18001 등 경영시스템 수립과 자율적 환경안전보건활동의 기반이 되도록 설계되어 있습니다. 법정 표준 양식과 프로세스를 기반으로 하면서 기업별 특수성도 반영합니다.
