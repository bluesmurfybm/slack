  answer: 서브페이지 없이 한 페이지에 모든 내용을 담는 형태입니다. 메인 인트로 1섹션, 서브 3섹션, 온라인 문의 1섹션으로 구성되며, 문의가 들어오면 이메일로 알려드리는 기능이 포함됩니다.

