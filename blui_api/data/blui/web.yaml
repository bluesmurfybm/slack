- id: WEB-001
  question: 홈페이지 제작 비용이 얼마인가요?
  aliases:
    - 홈페이지 얼마예요
    - 홈페이지 가격
    - 홈페이지 견적
    - 제작 비용
    - 제작비
    - 사이트 만드는데 얼마
    - 홈페이지 얼마나 들어요
    - 홈피 가격
    - 비용이 어느정도
  answer: 상품에 따라 다릅니다. 원페이지형은 100만원, 기본형은 200만원, 고급형은 350만원, 다국어형은 600만원부터 시작하며, 모두 VAT 별도이고 요구사항에 따라 달라집니다. 정확한 금액은 요구사항을 확인한 뒤 담당자가 산정해 드립니다.

- id: WEB-002
  question: 홈페이지 상품이 어떻게 나뉘나요?
  aliases:
    - 어떤 상품이 있나요
    - 상품 종류
