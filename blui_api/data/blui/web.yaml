    - 빨리 되나요
  answer: 제작 자체는 영업일 기준으로 원페이지형 3~5일, 기본형 2주, 고급형 4주, 다국어형 6주 이상 걸립니다. 상담과 자료 준비, 검수까지 포함한 전체 일정은 보통 2주 이상으로 보시면 되고, 자료가 준비되는 속도에 따라 달라집니다.

