- id: WEB-001
  question: 홈페이지 제작 비용이 얼마인가요?
  aliases:
    - 얼마예요
    - 가격
    - 견적
  answer: 상품에 따라 다릅니다. 원페이지형 100만원부터, 기본형 200만원부터, 고급형 350만원부터, 다국어형 600만원부터이며 모두 VAT 별도이고 요구사항에 따라 변동됩니다. 정확한 금액은 요구사항 확인 후 담당자가 산정해 드립니다.

- id: WEB-002
  question: 홈페이지 상품이 어떻게 나뉘나요?
  aliases:
    - 어떤 상품이 있나요
    - 종류
  answer: 일반형(원페이지형·기본형), 고급형(고급형·다국어형), 주문제작형으로 나뉩니다. 페이지 수와 필요한 기능에 따라 구간이 달라집니다.

- id: WEB-003
  question: 제작 기간은 얼마나 걸리나요?
  aliases:
    - 얼마나 걸려요
    - 언제 오픈 가능한가요
  answer: 원페이지형은 영업일 기준 3~5일, 기본형 2주부터, 고급형 4주부터, 다국어형 6주부터입니다. 자료 준비와 검수 일정에 따라 달라질 수 있습니다.

- id: WEB-004
  question: 제작비에 포함되는 서비스는 무엇인가요?
  aliases:
    - 뭐가 포함되나요
    - 추가 비용
  answer: 반응형 디자인, 검색엔진 최적화(SEO), 간단 유지보수 1년, 웹호스팅 및 도메인(SSL 포함) 1년이 공통으로 포함됩니다.

- id: WEB-005
  question: 수정은 몇 번까지 가능한가요?
  aliases:
    - 시안 수정
    - 몇 번 고칠 수 있나요
  answer: 일반형은 2회입니다. 고급형과 다국어형은 디자인 시안 수정 2회와 최종 검수 수정 2회가 제공됩니다.

- id: WEB-006
  question: 원페이지형은 어떤 홈페이지인가요?
  aliases:
    - 원페이지
    - 한 페이지
  answer: 서브페이지 없이 한 페이지에 모든 정보를 담는 형태입니다. 메인 인트로 1섹션, 서브 3섹션, 온라인 문의 1섹션으로 구성되며 문의 시 이메일 알림 기능이 포함됩니다.

- id: WEB-007
  question: 기본형에는 어떤 기능이 들어가나요?
  answer: 10페이지 이내로 구성되며 공지사항, 갤러리, 온라인문의, 접속통계 기능과 관리자 모드가 제공됩니다. 메인 인트로 배너 이미지도 포함됩니다.

- id: WEB-008
  question: 고급형은 무엇이 다른가요?
  aliases:
    - 예약 기능
    - 특화 기능
  answer: 20페이지 이내이며 기업·기관 아이덴티티를 살린 맞춤 디자인 시안 1종과 다양한 관리자 기능이 제공됩니다. 예약 기능 등 특화 기능을 합리적인 비용으로 선택할 수 있습니다.

- id: WEB-009
  question: 다국어 홈페이지도 되나요?
  aliases:
    - 영문 사이트
    - 해외용
  answer: 됩니다. 다국어형은 20페이지 이내 2개 언어를 제공하며 600만원부터(VAT 별도, 요구사항에 따라 변동)입니다. 동일 디자인 기준이고 번역 비용은 별도입니다.

- id: WEB-010
  question: 원하는 형태가 딱 없는데 가능한가요?
  aliases:
    - 맞춤 제작
    - 특이한 기능
  answer: 주문제작형으로 기획부터 디자인, 개발까지 맞춤 제작이 가능합니다. 제작 기간과 비용은 별도 협의이며, 아이디어가 정리되지 않은 상태에서도 함께 상의하며 진행합니다.

- id: WEB-011
  question: 도메인과 호스팅도 해주나요?
  answer: 웹호스팅과 도메인(SSL 포함)이 1년간 제공됩니다. 2년 차부터의 조건은 담당자가 안내해 드립니다.

- id: WEB-012
  question: 유지보수는 어디까지 해주나요?
  aliases:
    - 수정 요청
    - AS
  answer: 간단 유지보수 1년이 포함되며, 텍스트 교체·1:1 이미지 교체·오류 수정이 해당됩니다. 기능 추가나 디자인 변경은 별도 협의입니다.

- id: WEB-013
  question: 금액에 부가세가 포함된 건가요?
  answer: 안내된 금액은 모두 부가세(VAT) 별도입니다.
