    - 상품 구성
    - 뭐가 좋아요
  answer: 일반형(원페이지형·기본형), 고급형(고급형·다국어형), 주문제작형으로 나뉩니다. 페이지 수와 필요한 기능에 따라 맞는 상품이 달라집니다.

