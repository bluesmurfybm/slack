<div class="wrap">
  <div id="devbar" class="devbar" style="display:none"></div>

  <div class="toolbar">
    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input id="q" type="text" placeholder="제목·키워드·발표자 검색" oninput="render()">

    <div class="filters">

        <option value="">전체 상태</option>

      </select>
      <select id="f-req" onchange="render()">

</div>

<div class="overlay" id="overlay" onclick="if(event.target===this)closeForm()">
  <div class="sheet">
    <div class="sheet-head">
      <div><span class="k" id="sheet-kicker">신규 등록</span><h2 id="sheet-title">새 주제 등록</h2></div>
      <button class="x" onclick="closeForm()">×</button>
    </div>
    <div class="sheet-body">
      <div class="field">
        <label>제목 (주제)</label>
        <input id="f-title" type="text" placeholder="아티클 제목">
      </div>
      <div class="two">
        <div class="field">
          <label>분야</label>
          <input id="f-field-in" type="text" list="dl-field" autocomplete="off"
                 placeholder="UI/UX · Trend · Marketing · Etc">
          <datalist id="dl-field"></datalist>
        </div>
        <div class="field"><label>중요 키워드</label><input id="f-keywords" type="text" placeholder="생성형AI"></div>
      </div>
      <div class="field">
        <label>발표</label>
        <div class="seg" id="seg-req">
          <button type="button" id="req-recommended" class="on" onclick="setReq('recommended')">권장</button>
          <button type="button" id="req-required" onclick="setReq('required')">필수</button>
        </div>
      </div>
      <div class="field">
        <label>매거진 / Volume / Page</label>
        <div class="triple">
          <input id="f-magazine-in" type="text" list="dl-magazine" autocomplete="off" placeholder="DI">
          <input id="f-volume" type="text" placeholder="280">
          <input id="f-page" type="text" placeholder="46">
        </div>
        <datalist id="dl-magazine"></datalist>
      </div>
      <div class="two">
        <div class="field"><label>년도</label><select id="f-year"></select></div>
        <div class="field"><label>배정 팀 (선택)</label><select id="f-team"></select></div>
      </div>
      <div class="field">

      <div class="field">

      </div>

      <button class="btn-ghost" onclick="closeForm()">취소</button>
      <button class="btn-submit" onclick="submitForm()">저장</button>

</div>

<div class="overlay" id="confirmOverlay" onclick="if(event.target===this)closeConfirm()">
  <div class="cdialog">
    <h3>주제 삭제</h3>
    <p id="confirmText"></p>
    <div class="row-btn">
      <button class="btn-ghost" onclick="closeConfirm()">취소</button>
      <button class="btn-danger" onclick="doDelete()">삭제</button>
    </div>
  </div>
</div>

<div class="overlay" id="dateOverlay" onclick="if(event.target===this)closeDate(null)">
  <div class="cdialog">
    <h3 id="dateTitle">발표 예정일</h3>
    <p id="dateHint"></p>
    <input id="dateInput" type="date" class="date-field">
    <div class="row-btn">
      <button class="btn-ghost" onclick="closeDate(null)">취소</button>
      <button class="btn-submit" onclick="closeDate(document.getElementById('dateInput').value)">확인</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const USER_COLORS={
  "김호영":{bg:"#F5D9D4",fg:"#A8392B"},"박성철":{bg:"#F7E0CC",fg:"#B0642A"},
  "안정민":{bg:"#F4E8C6",fg:"#94741C"},"조성훈":{bg:"#E7ECCB",fg:"#6C782C"},
  "진소현":{bg:"#D5E7D1",fg:"#3B6B40"},"김태주":{bg:"#CEE8E0",fg:"#2C6D62"},
  "김지안":{bg:"#D1E4EE",fg:"#2A6184"},"김아랑":{bg:"#D8DCF0",fg:"#3A46A0"},
  "박화랑":{bg:"#E3D9F0",fg:"#68429F"},"유병문":{bg:"#EED7EC",fg:"#883C84"},
  "유승인":{bg:"#F3D7E1",fg:"#A83964"},"이한재":{bg:"#E6DCD0",fg:"#78593B"},
  "이준영":{bg:"#DBDFE3",fg:"#485663"}
};
function colorFor(name){
  if(USER_COLORS[name]) return USER_COLORS[name];
  let h=0; for(const ch of (name||"?")) h=(h*31+ch.charCodeAt(0))%360;
  return {bg:`hsl(${h},32%,87%)`,fg:`hsl(${h},42%,33%)`};
}
const esc=s=>(s==null?"":String(s)).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

let ME={};              // whoami 결과
let TOPICS=[];          // 서버 목록
let REQ="recommended";  // 폼의 필수/권장 선택
let EDIT_ID=null;
let PENDING_DELETE=null;

/* 세션이 끊긴 채(만료 등) API를 호출하면 401 — 포털 로그인으로 돌려보낸다.
   "/" 자체가 서버에서 로그인 여부를 확인하므로 이동만 시키면 된다.

   단 개발 모드에서는 "/" 가 401 이어도 화면을 그대로 내주므로, 여기서 이동시키면
   로드 -> 401 -> 이동 -> 로드 의 무한 새로고침이 된다. 계정 전환 바를 쓸 수 있게
   토스트만 띄우고 멈춘다. */
async function api(path,opts){
  const r=await fetch(path,Object.assign({credentials:"same-origin"},opts||{}));
  if(r.status===401){
    if(ME.dev_login) throw new Error("상단 개발 모드 바에서 계정을 선택해 주세요");
    location.href="/";
    throw new Error("unauthenticated");
  }
  if(!r.ok){
    let msg="요청이 실패했습니다";
    try{ msg=(await r.json()).detail||msg; }catch(e){}
    throw new Error(msg);
  }
  return r.status===204?null:r.json();
}

/* ---------- 목록 ---------- */
function visible(){
  const v=id=>document.getElementById(id).value;
  const q=v("q").trim().toLowerCase();
  const mine=document.getElementById("f-mine").checked;
  return TOPICS.filter(t=>
    (!v("f-field")    || t.field===v("f-field")) &&
    (!v("f-magazine") || t.magazine===v("f-magazine")) &&
    (!v("f-status")   || t.status===v("f-status")) &&
    (!v("f-req")      || t.requirement===v("f-req")) &&
    (!mine            || t.presenter_email===ME.email) &&
    (!q || `${t.title} ${t.keywords||""} ${t.presenter||""} ${t.team||""}`.toLowerCase().includes(q))
  );
}

function buildFilters(){
  const fill=(id,vals)=>{
    const el=document.getElementById(id), keep=el.value;
    el.innerHTML=`<option value="">${id==="f-field"?"전체 분야":"전체 매거진"}</option>`+
      vals.filter(Boolean).sort().map(x=>`<option>${esc(x)}</option>`).join("");
    el.value=keep;
  };
  fill("f-field",[...new Set(TOPICS.map(t=>t.field))]);
  fill("f-magazine",[...new Set(TOPICS.map(t=>t.magazine))]);
}

function render(){
  const rows=visible();
  const list=document.getElementById("list");
  document.getElementById("ledgerCount").textContent=`${rows.length}건 / 전체 ${TOPICS.length}건`;
  list.innerHTML=rows.length
    ? rows.map(rowHtml).join("")
    : '<li class="empty"><div class="big">해당하는 주제가 없어요</div><div>필터를 바꿔 보세요.</div></li>';
}

const STATUS_CLASS={"미지정":"open","발표예정":"planned","발표완료":"done"};

function rowHtml(t){
  const need=t.requirement==="required"
    ? '<span class="badge req">필수</span>'
    : '<span class="badge rec">권장</span>';
  const st=`<span class="badge st-${STATUS_CLASS[t.status]}">${esc(t.status)}</span>`;
  const who=t.presenter||t.team||"";
  const c=who?colorFor(who):null;
  const src=[t.magazine,t.volume&&`Vol.${t.volume}`,t.page&&`p.${t.page}`].filter(Boolean).join(" ");
  const when=t.done_date||t.planned_date||"";
  return `<li class="row">
    <div class="row-main">
      <div class="row-title">${esc(t.title)} ${need} ${st}</div>
      <div class="row-sub">
        ${t.field?`<span class="chip">${esc(t.field)}</span>`:""}
        ${t.keywords?`<span class="chip ghost">${esc(t.keywords)}</span>`:""}
        <span class="muted">${esc(src||"—")}</span>
      </div>
    </div>
    <div class="row-side">
      ${who?`<span class="who" style="background:${c.bg};color:${c.fg}">${esc(who)}</span>`
           :'<span class="who none">미지정</span>'}
      <span class="muted when">${esc(when||"—")}</span>
    </div>
    <div class="row-act">${actionsHtml(t)}</div>
  </li>`;
}

function actionsHtml(t){
  const out=[];
  if(t.status==="미지정"){
    out.push(`<button class="btn-mini primary" onclick="claim(${t.id})">내가 발표할게요</button>`);
  }else if(t.presenter_email===ME.email && t.status!=="발표완료"){
    out.push(`<button class="btn-mini" onclick="schedule(${t.id})">예정일</button>`);
    out.push(`<button class="btn-mini" onclick="release(${t.id})">취소</button>`);
  }
  if(ME.is_admin){
    if(t.status==="발표예정") out.push(`<button class="btn-mini" onclick="complete(${t.id})">발표완료</button>`);
    out.push(`<button class="btn-mini ghost" onclick="openEdit(${t.id})">수정</button>`);
    out.push(`<button class="btn-mini ghost danger" onclick="askDelete(${t.id})">삭제</button>`);
  }
  return out.join("");
}

/* ---------- 날짜 선택 ---------- */
/* prompt() 대신 <input type="date">. 취소는 null, 확인은 문자열("" 이면 날짜 없음). */
let dateResolver=null;
function askDate(title,hint,initial){
  document.getElementById("dateTitle").textContent=title;
  document.getElementById("dateHint").textContent=hint;
  document.getElementById("dateInput").value=initial||"";
  document.getElementById("dateOverlay").classList.add("open");
  setTimeout(()=>document.getElementById("dateInput").focus(),50);
  return new Promise(r=>{ dateResolver=r; });
}
function closeDate(v){
  document.getElementById("dateOverlay").classList.remove("open");
  if(dateResolver){ const r=dateResolver; dateResolver=null; r(v); }
}
const today=()=>new Date().toISOString().slice(0,10);

/* ---------- 선점 ---------- */
async function claim(id){
  const d=await askDate("발표 예정일","비워 두면 선점 후 '예정일' 버튼으로 정할 수 있어요.","");
  if(d===null) return;
  try{
    await api(`/magazineapi/topics/${id}/claim`,{
      method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({planned_date:d})});
    showToast("선점했습니다");
    await reload();
  }catch(e){ showToast(e.message); }
}

/* 선점 시 날짜를 비웠거나, 정해둔 날짜를 바꿀 때 */
async function schedule(id){
  const t=TOPICS.find(x=>x.id===id);
  const d=await askDate("발표 예정일","비워 두면 미정으로 돌아갑니다.",t?t.planned_date:"");
  if(d===null) return;
  try{
    await api(`/magazineapi/topics/${id}/schedule`,{
      method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({planned_date:d})});
    showToast(d?"예정일을 정했습니다":"예정일을 지웠습니다");
    await reload();
  }catch(e){ showToast(e.message); }
}

async function release(id){
  try{
    await api(`/magazineapi/topics/${id}/release`,{method:"POST"});
    showToast("선점을 취소했습니다");
    await reload();
  }catch(e){ showToast(e.message); }
}

async function complete(id){
  const d=await askDate("발표일","비워 두면 오늘 날짜로 기록됩니다.",today());
  if(d===null) return;
  try{
    await api(`/magazineapi/topics/${id}/complete`,{
      method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({done_date:d})});
    showToast("발표완료 처리했습니다");
    await reload();
  }catch(e){ showToast(e.message); }
}

/* ---------- 등록 / 수정 ---------- */
const FORM_IDS=["f-title","f-field-in","f-keywords","f-magazine-in","f-volume","f-page","f-year","f-team","f-planned","f-note"];
const TEAMS=["App","LAB","SQUARE"];

/* 분야·매거진은 기존 값 자동완성, 년도·팀은 드롭박스. 모두 현재 데이터에서 만든다. */
function buildFormOptions(){
  const fillDL=(id,vals)=>{
    document.getElementById(id).innerHTML=
      [...new Set(vals)].filter(Boolean).sort()
        .map(v=>`<option value="${esc(v)}"></option>`).join("");
  };
  fillDL("dl-field",TOPICS.map(t=>t.field));
  fillDL("dl-magazine",TOPICS.map(t=>t.magazine));

  const years=new Set(TOPICS.map(t=>t.year).filter(Boolean));
  const now=new Date().getFullYear();
  for(let y=now-1;y<=now+1;y++) years.add(y);
  document.getElementById("f-year").innerHTML='<option value="">선택</option>'+
    [...years].sort((a,b)=>b-a).map(y=>`<option value="${y}">${y}</option>`).join("");

  const teams=new Set(TEAMS);
  TOPICS.forEach(t=>{ if(t.team) teams.add(t.team); });
  document.getElementById("f-team").innerHTML='<option value="">없음</option>'+
    [...teams].sort().map(t=>`<option>${esc(t)}</option>`).join("");
}

function openSheet(){ document.getElementById("overlay").classList.add("open"); }
function closeSheet(){ document.getElementById("overlay").classList.remove("open"); }
function closeForm(){ closeSheet(); }

function setReq(v){
  REQ=v;
  document.getElementById("req-recommended").classList.toggle("on",v==="recommended");
  document.getElementById("req-required").classList.toggle("on",v==="required");
}

function openForm(){
  EDIT_ID=null;
  FORM_IDS.forEach(id=>document.getElementById(id).value="");
  setReq("recommended");
  document.getElementById("sheet-kicker").textContent="신규 등록";
  document.getElementById("sheet-title").textContent="새 주제 등록";
  openSheet();
}

function openEdit(id){
  const t=TOPICS.find(x=>x.id===id);
  if(!t) return;
  EDIT_ID=id;
  const s=(el,v)=>document.getElementById(el).value=(v==null?"":v);
  s("f-title",t.title); s("f-field-in",t.field); s("f-keywords",t.keywords);
  s("f-magazine-in",t.magazine); s("f-volume",t.volume); s("f-page",t.page);
  s("f-year",t.year); s("f-team",t.team); s("f-planned",t.planned_date); s("f-note",t.note);
  setReq(t.requirement);
  document.getElementById("sheet-kicker").textContent="수정";
  document.getElementById("sheet-title").textContent="주제 수정";
  openSheet();
}

function formValues(){
  const g=id=>document.getElementById(id).value.trim();
  return {
    title:g("f-title"), field:g("f-field-in"), keywords:g("f-keywords"),
    magazine:g("f-magazine-in"), volume:g("f-volume"), page:g("f-page"),
    year:g("f-year")?Number(g("f-year")):null,
    requirement:REQ, team:g("f-team"), planned_date:g("f-planned"), note:g("f-note"),
  };
}

async function submitForm(){
  const v=formValues();
  if(!v.title){ showToast("제목을 입력해 주세요"); return; }
  try{
    if(EDIT_ID){
      await api(`/magazineapi/topics/${EDIT_ID}`,{
        method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(v)});
      showToast("수정했습니다");
    }else{
      await api("/magazineapi/topics",{
        method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(v)});
      showToast("등록했습니다");
    }
    closeSheet();
    await reload();
  }catch(e){ showToast(e.message); }
}

/* ---------- 삭제 ---------- */
function askDelete(id){
  const t=TOPICS.find(x=>x.id===id);
  PENDING_DELETE=id;
  document.getElementById("confirmText").textContent=`"${t?t.title:""}" 주제를 삭제할까요?`;
  document.getElementById("confirmOverlay").classList.add("open");
}
function closeConfirm(){ document.getElementById("confirmOverlay").classList.remove("open"); }
async function doDelete(){
  try{
    await api(`/magazineapi/topics/${PENDING_DELETE}`,{method:"DELETE"});
    showToast("삭제했습니다");
    closeConfirm();
    await reload();
  }catch(e){ showToast(e.message); }
}

/* ---------- 공통 ---------- */
let toastT;
function showToast(m){const el=document.getElementById("toast");el.textContent=m;el.classList.add("show");clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove("show"),2200);}

function toggleUserMenu(e){
  if(e) e.stopPropagation();
  document.getElementById("hdrUserMenu").classList.toggle("open");
}
document.addEventListener("click",(e)=>{
  const um=document.getElementById("hdrUserMenu");
  if(um && !um.contains(e.target)) um.classList.remove("open");
});

/* ---------- 개발 모드 계정 전환 ---------- */
function buildDevBar(){
  const bar=document.getElementById("devbar");
  if(!ME.dev_login){ bar.style.display="none"; return; }
  bar.style.display="";
  bar.innerHTML='<span class="muted">개발 모드 — 계정 전환:</span> '+
    (ME.dev_accounts||[]).map(a=>
      `<button class="btn-mini${a.email===ME.email?" on":""}" onclick="devLogin('${esc(a.email)}')">${esc(a.name)} (${esc(a.role)})</button>`
    ).join("");
}
async function devLogin(email){
  await api("/magazineapi/devlogin",{
    method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email})});
  await loadAll();
}

/* ---------- 부팅 ---------- */
async function loadWhoami(){
  ME=await api("/magazineapi/whoami");
  document.body.classList.toggle("is-admin",!!ME.is_admin);
  const portalUrl=(ME.portal_url||"").replace(/\/+$/,"");
  document.getElementById("hdrBrand").href=portalUrl||"#";
  document.getElementById("dd-mypage").href=portalUrl?`${portalUrl}/?view=profile`:"#";
  document.getElementById("dd-slack").href=ME.slack_url||"#";
  document.getElementById("dd-logout").href=portalUrl?`${portalUrl}/logout.php`:"#";
  document.getElementById("hdrName").textContent=ME.name||"(로그인 필요)";
  const av=document.getElementById("hdrAvatar");
  av.textContent=(ME.name||"?").slice(0,1);
  av.style.background=ME.color||colorFor(ME.name).fg;
}

async function reload(){
  TOPICS=await api("/magazineapi/topics");
  buildFilters();
  buildFormOptions();
  render();
}

async function loadAll(){
  await loadWhoami();
  buildDevBar();
  try{
    await reload();
  }catch(e){
    if(e.message!=="unauthenticated") showToast(e.message);
  }
}

document.addEventListener("keydown",e=>{if(e.key==="Escape"){closeSheet();closeConfirm();closeDate(null);}});
loadAll();
</script>
