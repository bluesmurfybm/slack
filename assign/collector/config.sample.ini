[db]
host = 127.0.0.1
port = 3306
name = iworks_local
user = root
password = 
charset = utf8mb4

[source]
boards = 블루소프트
include_archived = true
list_url = https://bluesoft.slack.com/lists/T0000000/F0000000
skip_empty_title = true

[collect]
default_days = 7
batch_size = 500
dry_run_limit = 100

[normalize]
orgs_file = orgs.json
aliases_file = member_aliases.json
use_schools_table = true

[log]
level = info
unmatched_file = unmatched_members.log

[score]
baseline_percentile = 0.90

