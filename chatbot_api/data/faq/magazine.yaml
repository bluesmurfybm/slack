- id: magazine-fields
  question: 발표 분야는 어떻게 나뉘나요?
  answer: UI/UX, Marketing, Trend, AX, Etc 다섯 가지입니다.
- id: magazine-magazines
  question: 어떤 매거진을 다루나요?
  answer: DI와 MIT Technology Review를 주로 다루고 그 밖의 출처는 Etc로 묶습니다. 주제마다 권호와 페이지, 발행 연도를 함께 기록합니다.
- id: magazine-teams
  question: 발표 주제에 팀이 붙어 있던데요.
  answer: LAB, SQUARE, APP 팀으로 구분합니다. 팀이 지정되지 않은 주제도 있습니다.
- id: magazine-scan-slot
  question: 주제에 올리는 자료 칸이 두 개로 보여요.
  answer: 자료 칸과 스캔 칸이 따로 있습니다. 각 칸에는 파일이나 링크 중 하나를 올립니다.
- id: magazine-hidden-topic
  question: 주제 목록에 안 보이는 주제가 있어요.
  answer: 구성원 화면에 노출하지 않도록 꺼 둔 주제이거나 보관 처리된 주제입니다. 두 경우 모두 선점할 수 없습니다.
- id: magazine-related-topic
  question: 비슷한 주제를 찾아볼 수 있나요?
  answer: 네. 주제마다 연관된 다른 주제가 연결되어 있어 함께 살펴볼 수 있습니다.
- id: magazine-keywords
  question: 발표 주제는 어떻게 검색하나요?
  answer: 주제마다 키워드가 함께 등록되어 있어 제목뿐 아니라 키워드로도 찾을 수 있습니다.
