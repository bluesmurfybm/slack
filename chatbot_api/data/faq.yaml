- id: lunch-time
  question: 점심 시간이 어떻게 되나요?
  answer: 11시 50분 부터 13시까지 입니다.
- id: business-time
  question: 근무 시간이 어떻게 되나요?
  answer: 평일 09:00~18:00이며 주말과 공휴일은 휴무입니다.
- id: password-reset
  question: 비밀번호를 잊어버렸어요.
  answer: iwork 개발자 분들께 문의해주세요.
- id: annual-leave-request
  question: 연차는 어떻게 신청하나요?
  answer: 네이버 웍스에서 신청해주세요.
- id: annual-leave-count
  question: 연차가 며칠 남았는지 어디서 보나요?
  answer: 네이버 나의 연차 화면에서 확인하실 수 있습니다.
- id: half-day-leave
  question: 반차도 쓸 수 있나요?
  answer: 오전 반차와 오후 반차 모두 가능하며 연차 0.5일이 차감됩니다.
- id: portal-what
  question: blue-iWorks 가 뭐예요?
  answer: Bluesoft 사내 업무 포털입니다. 로그인 한 번으로 BlueBooks, Coursemos WorkHub, DTI 발표, BlueLearn, Coursemos EnvHub, MoodleUp? 을 모두 사용할 수 있습니다.
- id: portal-services
  question: 포털에서 쓸 수 있는 시스템이 뭐가 있나요?
  answer: 대시보드에 여섯 개가 있습니다. BlueBooks(도서구매신청), Coursemos WorkHub(업무현황판), DTI 발표(매거진 발표), BlueLearn(강의 수강료 지원), Coursemos EnvHub(대학 접속정보), MoodleUp?(무들 동향)입니다.
- id: portal-login
  question: 로그인은 어떻게 하나요?
  answer: 회사 이메일과 비밀번호로 로그인합니다. 이메일이 유일한 식별자이고, 계정은 사내 인원 명단으로 미리 만들어져 있어 별도 회원가입은 없습니다.
- id: portal-initial-password
  question: 초기 비밀번호가 뭐예요?
  answer: blue$123 입니다. 초기 비밀번호를 바꾸기 전에는 로그인 직후 마이페이지 화면에 고정되어 다른 화면을 쓸 수 없으니 먼저 변경해 주세요.
- id: portal-password-change
  question: 비밀번호를 바꾸고 싶어요.
  answer: 마이페이지에서 수정을 누르고 새 비밀번호 칸에 입력한 뒤 저장하면 됩니다. 비워 두면 기존 비밀번호가 그대로 유지됩니다.
- id: portal-auto-login
  question: 자동 로그인은 얼마나 유지되나요?
  answer: 로그인 화면에서 자동 로그인을 체크하면 30일 동안 유지되고 방문할 때마다 기간이 다시 늘어납니다. 체크하지 않으면 브라우저를 닫을 때 로그아웃됩니다.
- id: portal-mypage
  question: 내 정보는 어디서 바꾸나요?
  answer: 우측 상단 사용자 메뉴의 마이페이지에서 이름, 이메일, 고유 색상, 비밀번호, 슬랙 연동 토큰을 바꿀 수 있습니다. 수정 버튼을 눌러야 입력칸이 열립니다.
- id: portal-color
  question: 고유 색상은 어디에 쓰이나요?
  answer: 화면에 보이는 내 아바타와 뱃지 색으로 쓰입니다. 마이페이지에서 색상표에서 고르거나 직접 지정할 수 있습니다.
- id: portal-sso
  question: 시스템마다 따로 로그인해야 하나요?
  answer: 아니요. 한 번 로그인하면 대시보드의 모든 시스템이 같은 로그인으로 연결됩니다.
- id: slack-token-why
  question: 슬랙 연동 토큰은 왜 등록해야 하나요?
  answer: 업무현황판이 본인 슬랙 계정으로 요청 목록을 읽어오기 때문입니다. 토큰이 없으면 업무현황판에 들어갈 때 마이페이지로 돌아가 등록을 안내합니다.
- id: slack-token-where
  question: 슬랙 토큰은 어디에 등록하나요?
  answer: 마이페이지의 슬랙 연동 토큰 칸에 본인 토큰을 붙여넣고 저장합니다. 저장 후에는 화면에 원문이 다시 표시되지 않습니다.
- id: slack-token-security
  question: 슬랙 토큰이 유출된 것 같아요.
  answer: 즉시 슬랙에서 토큰을 재발급하고 마이페이지에 새 토큰으로 다시 저장해 주세요. 토큰은 개인 민감정보라 본인만 입력하고 수정합니다.
- id: slack-token-scope
  question: 슬랙 토큰이 없으면 아무것도 못 쓰나요?
  answer: 업무현황판만 막힙니다. BlueBooks 를 비롯한 나머지 시스템은 토큰 없이도 사용할 수 있습니다.
- id: workhub-what
  question: Coursemos WorkHub 는 뭐 하는 곳이에요?
  answer: 슬랙으로 들어온 유지보수 요청 목록을 한 화면에서 확인하고 관리하는 업무현황판입니다.
- id: workhub-features
  question: 업무현황판에 어떤 기능이 있나요?
  answer: 요청 목록과 댓글, 담당자 지정, 난이도 분석, 카테고리 분석, 유사 요청 찾기, 대학 사이트 관리, Gmail 뷰어가 있습니다.
- id: books-what
  question: BlueBooks 는 어떤 서비스예요?
  answer: 읽고 싶은 책을 신청하고 처리 현황을 확인하는 도서구매신청 시스템입니다.
- id: books-applicant
  question: 다른 사람 이름으로 도서를 신청할 수 있나요?
  answer: 아니요. 신청자는 항상 로그인한 본인으로 기록됩니다.
- id: books-edit
  question: 신청한 도서를 수정하거나 취소할 수 있나요?
  answer: 본인이 신청한 건은 수정하고 삭제할 수 있습니다. 완료 처리는 관리자만 할 수 있습니다.
- id: magazine-what
  question: DTI 발표는 뭐예요?
  answer: DI, MIT Technology Review 같은 매거진 아티클을 읽고 발표해 지식을 공유하는 활동입니다. 아티클 목록과 발표 현황을 화면에서 관리합니다.
- id: magazine-claim
  question: 발표 주제를 직접 고를 수 있나요?
  answer: 네. 미지정 주제는 선점해서 직접 가져갈 수 있습니다. 이미 발표가 끝났거나 숨김 또는 보관된 주제는 선점할 수 없습니다.
- id: magazine-status
  question: 발표 주제는 어떤 단계로 진행되나요?
  answer: 미지정에서 발표예정, 자료준비 완료, 발표완료 순으로 진행됩니다. 발표자가 정해지면 발표예정이고 발표일이 기록되면 발표완료입니다.
- id: magazine-material
  question: 발표 자료는 어떻게 올리나요?
  answer: 주제 상세 화면에서 파일이나 링크 중 하나를 올립니다. 아티클당 자료는 하나이며 발표자 본인이나 관리자만 등록할 수 있습니다.
- id: magazine-kind
  question: 발표 구분은 뭐가 있나요?
  answer: 필수, 권장, 일반 세 가지입니다.
- id: magazine-cancel
  question: 예약한 아티클/매거진을 취소할 수 있나요?
  answer: 네. 아티클/매거진 취소와 발표 예정일 변경은 본인 또는 관리자가 할 수 있습니다.
- id: bluelearn-what
  question: BlueLearn 은 뭐 하는 서비스예요?
  answer: 역량 강화를 위한 외부 강의를 신청하고 수강료를 지원받는 시스템입니다.
- id: bluelearn-flow
  question: 강의 신청은 어떤 순서로 진행되나요?
  answer: 수강승인요청, 수강승인, 수강료청구, 청구승인, 환급완료 순으로 진행됩니다. 승인되지 않으면 수강반려나 청구반려로 처리됩니다.
- id: bluelearn-refund-target
  question: 모든 강의가 수강료 환급 대상인가요?
  answer: 아니요. 무료 강의와 회사 계정으로 결제한 강의는 환급 대상이 아닙니다. 회사 계정 건은 환급불필요로 종결됩니다.
- id: bluelearn-refund-amount
  question: 수강료는 얼마까지 지원되나요?
  answer: 건당 상한과 연간 한도는 관리자가 정책 화면에서 설정한 값에 따릅니다. 신청 화면에서 예상 환급액을 확인할 수 있고, 상한은 신청 시점 값으로 고정됩니다.
- id: bluelearn-cert
  question: 이수증은 언제 내야 하나요?
  answer: 수강을 마친 뒤 수강료를 청구할 때 이수증을 올립니다. 올린 파일은 주소로 직접 열 수 없게 보호됩니다.
- id: envhub-what
  question: Coursemos EnvHub 는 뭐예요?
  answer: 대학별 svn·git 주소, 사이트 로그인, 개발·운영·학사 DB, plink 터널링, 배포 방법을 찾아 클립보드로 복사하는 화면입니다.
- id: envhub-school-version
  question: 같은 대학이 여러 개로 보여요.
  answer: 학교는 이름과 버전으로 구분합니다. 같은 대학이라도 버전이 다르면 서버와 저장소, 계정이 전부 다른 별개 사이트라 따로 관리합니다.
- id: moodleup-what
  question: MoodleUp? 은 뭐 하는 곳이에요?
  answer: 무들의 PAG 코스, 트래커, 릴리스, 개발 문서 변화를 모아 코스모스 관점으로 요약해 주는 주간 리포트 화면입니다.
- id: moodleup-when
  question: MoodleUp? 리포트는 언제 갱신되나요?
  answer: 주 1회 월요일 오전 6시에 자동으로 수집하고 요약합니다. 화면에서 지금 다시 가져오기를 눌러 직접 갱신할 수도 있습니다.
- id: chatbot-scope
  question: 이 챗봇은 무엇을 답할 수 있나요?
  answer: 등록된 FAQ를 근거로만 답합니다. 근거가 없는 질문에는 답을 지어내지 않고 알맞은 대답을 찾을 수 없다고 안내합니다.
- id: chatbot-ask-more
  question: 챗봇이 모르는 걸 물어보고 싶어요.
  answer: FAQ에 없는 내용은 iwork 개발자에게 문의해 주세요. 자주 나오는 질문은 FAQ에 추가할 수 있습니다.
- id: chatbot-token-usage
  question: 토큰을 얼마나 사용했나요?
  answer: 궁금하죠? 궁금하면 오백원 ㅋㅋ
